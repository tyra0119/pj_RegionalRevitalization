<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>訪日外国人 広域誘導シミュレーター</title>
    <meta
      name="description"
      content="首都圏に集中する訪日外国人を、公共交通で行ける周辺県へ誘導できる余地を、FF-Data と ODPT の時刻表から可視化する what-if シミュレーター。"
    />
    <script type="module" crossorigin src="/pj_RegionalRevitalization/assets/index-GSK28f7W.js"></script>
    <link rel="stylesheet" crossorigin href="/pj_RegionalRevitalization/assets/index-ByMabkKp.css">
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <h1>東京から電車で行けるのに、まだ外国人が来ていない地方</h1>
        <p class="subtitle">
          訪日外国人 広域誘導シミュレーター
          <span class="badge">公共交通オープンデータチャレンジ2026</span>
        </p>
      </div>
      <nav class="tabs" id="tabs" aria-label="画面切り替え">
        <button class="tab is-active" data-screen="flow">1. 現状</button>
        <button class="tab" data-screen="gap">2. ギャップ</button>
        <button class="tab" data-screen="whatif">3. シミュレーション</button>
      </nav>
    </header>

    <main id="app">
      <section class="screen is-active" id="screen-flow">
        <div class="screen-head">
          <h2>東京から周辺9県へ、どれだけ人が動いているか</h2>
          <p class="lead" id="flow-lead"></p>
        </div>
        <div class="split">
          <div class="map-wrap"><div id="flow-map"></div></div>
          <aside class="panel" id="flow-panel"></aside>
        </div>
      </section>

      <section class="screen" id="screen-gap">
        <div class="screen-head">
          <h2>近いのに来ていない県と、案内すらできない県</h2>
          <p class="lead" id="gap-lead"></p>
        </div>
        <div class="split">
          <div class="chart-wrap"><div id="gap-chart"></div></div>
          <aside class="panel" id="gap-panel"></aside>
        </div>
      </section>

      <section class="screen" id="screen-whatif">
        <div class="screen-head">
          <h2>もし、公共交通で行ける県へ分散したら</h2>
          <p class="lead" id="whatif-lead"></p>
        </div>
        <div class="controls" id="whatif-controls"></div>
        <div class="split">
          <div class="chart-wrap"><div id="whatif-chart"></div></div>
          <aside class="panel" id="whatif-panel"></aside>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="footer"></footer>

  </body>
</html>
